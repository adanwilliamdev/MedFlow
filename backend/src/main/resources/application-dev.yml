spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/medflow
    username: medflow_user
    password: medflow_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    com.medflow: DEBUG